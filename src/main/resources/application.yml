server:
  port: 8001
spring:
  aop:
    auto: true
    proxy-target-class: true
  jmx:
    default-domain: 2.0
  profiles:
    active: dev

# 服务相关配置
game:
  # 0.测试 1.开服
  type: 0
  # 是否开启充值：0.否 1.是
  recharge: 1
  # 经验倍数  如果无，设置 0
  exp_times: 20
  # 多少等级后经验乘以倍数  如果无，设置 0
  exp_times_level: 1080
  # 服务器编号  每增加一个台数字 +1
  serial: 1
  # 开服时间戳
  date: 1655699168000
  # 区组名称
  name: 一区
  # 区组标识  每增加一个，数字 +1
  marking: xy_ac
  # 区组比例
  ratio: 1000
  # 区组端口
  serverPort: 14721
  # 游戏版本
  versions: 1.12.2
  # 个人离线时间
  aloneOfflineTime: 1200000
  # 团队离线时间
  teamOfflineTime: 2400000
# 引擎版本
engine:
  versions: 20.23.13

# 内网通讯验证
cxf:
  # cxf账号
  username: moyec
  # cxf密码
  password: moyec
  # 发送cxf地址
  sendIp: 127.0.0.1
  # 发送cxf端口
  sendPort: 90
  # 发送cxf账号
  sendName: moyec
  # 发送cxf密码
  sendPwd: moyec
# 中心服配置
cross:
  center:
    bit: 0
    ip: 127.0.0.1
    rpcPort: 6001
    gamePort: 5011

# 网关地址
login_server_url: http://172.23.123.84:85

# 内网通讯验证
send:
  # 网关服务器IP
  sendIp: 127.0.0.1
  # 网关服务端口
  sendPort: 85
  sendName: 4kED4EItrU
  sendPwd: 4kED4EItrU

#短信服务Redis
sms:
  redisHost: 127.0.0.1
  # 端口
  redisPort: 6379
  # 密码
